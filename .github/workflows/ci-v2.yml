name: CI v2

on:
  push:
    branches: [main, "claude/**", "refacto/**"]
    paths: ["v2/**", ".github/workflows/ci-v2.yml"]
  pull_request:
    paths: ["v2/**", ".github/workflows/ci-v2.yml"]

permissions:
  contents: read

concurrency:
  group: ci-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Les secrets ne doivent plus JAMAIS entrer dans l'historique : c'est le
  # constat le plus grave de l'audit de la v1 (mot de passe Azure SQL, clé de
  # compte de stockage et clé secrète Stripe, présents depuis février 2025).
  secrets:
    name: Fuite de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Le binaire gitleaks, pas l'action : celle-ci exige une licence payante
      # dès que le dépôt appartient à une organisation, et échouait donc à
      # CHAQUE exécution depuis qu'elle a été ajoutée. Un job qui ne peut pas
      # passer n'est pas une vérification, c'est un voyant rouge qu'on apprend
      # à ignorer — et c'est ainsi qu'on cesse de regarder les autres.
      - name: Installer gitleaks
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar xz gitleaks
          ./gitleaks version

      # Analyse de l'ARBRE DE TRAVAIL. L'historique, lui, contient réellement
      # les identifiants de production de la v1 (constat SEC-04) : le scanner y
      # trouvera toujours quelque chose, et un job condamné à échouer ne
      # signale plus rien. Ces identifiants doivent être RÉVOQUÉS — les retirer
      # de l'historique ne les dé-divulgue pas. Ce contrôle-ci garantit qu'aucune
      # NOUVELLE fuite n'entre dans le dépôt.
      - name: Aucun secret dans l'arbre de travail
        run: ./gitleaks detect --no-git --source . --redact --no-banner --exit-code 1

  build:
    name: Compilation, tests, frontières de modules
    runs-on: ubuntu-latest
    # Valkey parle le protocole Redis : l'adaptateur de cache se teste contre
    # l'un ou l'autre. CacheValkeyIT ÉCHOUE si aucun serveur n'est joignable,
    # plutôt que de se désactiver en silence — un test qui s'ignore lui-même
    # donne la même couleur qu'un test qui passe.
    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # ./mvnw et non mvn : la CI doit emprunter le MÊME chemin d'entrée qu'un
      # contributeur. Avec « mvn » après setup-java, une enveloppe Maven absente
      # du dépôt donne une chaîne verte et un contributeur bloqué — c'est
      # exactement ce qui s'est produit.
      - name: Tests unitaires et architecture
        working-directory: v2/backend
        run: ./mvnw -B test

      # Testcontainers démarre un vrai PostgreSQL : les garanties du système
      # (exclusion GiST, index partiels, triggers d'immuabilité) n'existent que
      # dans la base, les tester ailleurs reviendrait à ne pas les tester.
      #
      # Les identifiants de stockage sont factices et le restent : aucun test
      # d'intégration ne dépose de fichier. Ils sont là parce que l'adaptateur
      # S3 est construit au démarrage du contexte et refuse un secret vide —
      # sans eux, TOUS les tests d'intégration échouaient sur une
      # NullPointerException du SDK AWS, et c'est ce qui se produisait depuis
      # que le module média existe.
      - name: Tests d'intégration
        working-directory: v2/backend
        env:
          MINIO_USER: ci
          MINIO_PASSWORD: ci_factice_aucun_depot_dans_les_tests
        run: ./mvnw -B verify

      - name: Rapports de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: v2/backend/target/*-reports/
          retention-days: 7

  # Ce que rencontre quelqu'un qui clone le dépôt, dans l'ordre où il le
  # rencontre. Les autres jobs appellent les outils directement et passeraient
  # sans rien remarquer si le Makefile était cassé — ce qui est arrivé : une
  # enveloppe Maven absente rendait toutes les cibles inutilisables, chaîne
  # verte comprise.
  demarrage:
    name: Parcours d'un nouveau contributeur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: make init
        working-directory: v2
        run: make init && test -f .env

      # Sans cache, sans préinstallation : exactement un clone neuf.
      - name: make test
        working-directory: v2
        run: make test

      - name: make front-test
        working-directory: v2
        run: make front-test

  frontend:
    name: Portail public
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: v2/frontend/package-lock.json

      - name: Installer
        working-directory: v2/frontend
        run: npm ci

      # TypeScript strict : appeler une route qui n'existe pas doit devenir
      # une erreur de compilation, pas un 405 découvert en production comme
      # dans la v1 (trois endpoints appelés et jamais implémentés).
      - name: Typage
        working-directory: v2/frontend
        run: npm run typecheck

      - name: Tests
        working-directory: v2/frontend
        run: npm test

      - name: Build
        working-directory: v2/frontend
        run: npm run build

  analyse:
    name: Analyse statique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      # L'action précédente tirait une image abandonnée qui plantait à chaque
      # exécution sur « invalid rule severity value: MEDIUM ». Comme le job
      # portait continue-on-error, il rapportait un SUCCÈS sans avoir rien
      # analysé. Un analyseur cassé qui passe pour vert est pire qu'un analyseur
      # absent : on croit être couvert.
      - name: Installer semgrep
        run: pip install --quiet semgrep

      - name: Semgrep
        run: |
          set +e
          semgrep scan --config=p/java --config=p/secrets --config=p/owasp-top-ten \
            --metrics=off --sarif --output=semgrep.sarif v2/
          code=$?
          set -e
          # 0 = rien trouvé · 1 = des constats · >= 2 = l'analyseur a échoué.
          # Seul le dernier cas fait échouer le job. Les constats méritent un
          # tri avant de bloquer une chaîne — mais l'analyseur, lui, doit
          # s'exécuter, et son échec ne doit plus jamais passer inaperçu.
          if [ "$code" -ge 2 ]; then
            echo "::error::semgrep n'a pas pu s'exécuter (code $code)"
            exit 1
          fi
          echo "semgrep a terminé (code $code)"

      - name: Rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep
          path: semgrep.sarif
          retention-days: 7
          if-no-files-found: warn

  # Une sauvegarde jamais restaurée n'est pas une sauvegarde. L'exercice tourne
  # ici pour que la chaîne casse en CI plutôt que le jour où on en a besoin :
  # il ne vérifie pas que pg_restore est sorti en 0, il compare le contenu, le
  # schéma, puis tente sur la base restaurée les écritures qu'elle doit refuser.
  sauvegarde:
    name: Exercice de restauration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_seulement
          POSTGRES_DB: ensimasso
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci_seulement
      PGDATABASE: ensimasso
    steps:
      - uses: actions/checkout@v4

      - name: Outils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age postgresql-client-16

      # Les migrations sont du SQL pur : les rejouer sans Flyway garde ce job
      # indépendant de la chaîne Java, donc rapide et lisible quand il casse.
      - name: Migrations et jeu de données
        run: |
          for f in v2/backend/src/main/resources/db/migration/V*.sql; do
            echo "→ $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
          psql -v ON_ERROR_STOP=1 -q -f v2/infra/postgres/seed-dev.sql

      - name: Exercice complet
        run: v2/infra/sauvegarde/drill-restauration.sh ensimasso

  manifestes:
    name: Manifestes Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz kubeconform
          ./kubeconform -strict -summary -ignore-missing-schemas \
            v2/infra/k8s/base/*.yaml v2/infra/k8s/argocd/*.yaml

      # Ce que kubeconform ne peut pas voir : une clé de ConfigMap référencée
      # qui n'existe pas, un conteneur sans limite de ressources, et surtout un
      # Secret qui se serait glissé dans le dépôt.
      - name: Cohérence et absence de secrets
        run: python3 v2/infra/k8s/verifier-manifests.py

  image:
    name: Image conteneur
    needs: [build, secrets, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Construire
        uses: docker/build-push-action@v6
        with:
          context: v2/backend
          push: false
          load: true
          tags: ensimasso-core:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Une image qui part en production sans être scannée est un pari.
      - name: Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ensimasso-core:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
