<!doctype html>
<!-- lang="fr" : l'interface est en français. La v1 servait lang="en", ce qui
     induit en erreur les lecteurs d'écran et les outils de traduction. -->
<html lang="fr">
  <head>
    <!-- Favicon en ligne : évite un 404 sur chaque chargement de page,
         et une requête réseau pour seize octets de dessin. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f4e79'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='16' font-weight='700' fill='%23fff' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Titre et description réels, pas ceux de l'outil de génération : la v1
         a été déployée avec <title>React App</title> et un manifeste nommé
         « Create React App Sample ». -->
    <title>Associations de l'ENSIM</title>
    <meta name="description" content="Les associations étudiantes de l'ENSIM : évènements, adhésions, clubs et vie de campus." />
    <meta name="theme-color" content="#1F4E79" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Ce site nécessite JavaScript. Les pages des associations restent consultables via l'API publique.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
