# Le portail est une application à page unique : toute route inconnue doit
# rendre index.html, sinon un rechargement sur /assos/bde/2024-2025 donne un 404.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # nginx écrit des fichiers temporaires — corps de requête, réponses d'amont
    # — sous /var/cache/nginx, qui appartient à root. Le conteneur tourne en
    # tant que « nginx » : il ne peut pas y écrire, et nginx refuse de démarrer
    # AVANT même de servir quoi que ce soit :
    #
    #     [emerg] mkdir() "/var/cache/nginx/client_temp" failed (13: Permission denied)
    #
    # L'image n'avait donc jamais pu démarrer, nulle part — ce qui n'a pas été
    # vu tant que la chaîne se contentait de la CONSTRUIRE. Le Dockerfile
    # affirmait pourtant « nginx n'écrit que dans /tmp » : ce n'était vrai que
    # du fichier de PID.
    #
    # Rediriger vers /tmp plutôt que d'ouvrir /var/cache en écriture : c'est ce
    # qui rend l'affirmation vraie, et le système de fichiers racine réellement
    # montable en lecture seule.
    client_body_temp_path /tmp/nginx-corps;
    proxy_temp_path       /tmp/nginx-amont;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    # Les en-têtes de sécurité sont portés ici pour les fichiers statiques ;
    # l'API porte les siens dans SecurityConfig. Les deux sont nécessaires :
    # ils ne sont pas servis par le même processus.
    #
    # RÉPÉTÉS dans chaque `location` qui déclare son propre `add_header`, et
    # ce n'est pas une maladresse à nettoyer : nginx n'hérite les `add_header`
    # d'un niveau supérieur QUE si le niveau courant n'en déclare aucun. Il
    # remplace, il n'ajoute pas. Déclarés une seule fois ici, ils ne
    # s'appliquaient donc à AUCUNE réponse — vérifié en interrogeant un vrai
    # nginx : ni « / », ni « /index.html », ni une route du portail, ni un
    # fichier de /assets/ ne portait X-Frame-Options. Le portail entier était
    # encadrable, alors que le fichier annonçait le contraire.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Les fichiers produits par Vite portent une empreinte dans leur nom :
    # ils sont immuables, et se mettent en cache pour de bon.
    location /assets/ {
        # Une seule directive de cache : `expires` et `add_header` posaient
        # deux en-têtes Cache-Control contradictoires dans la même réponse.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # index.html, lui, ne doit JAMAIS être mis en cache : c'est lui qui
    # désigne la version des fichiers à charger.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Le proxy vers l'API garde tout sur la même origine : pas de CORS, donc
    # pas de liste d'origines autorisées à tenir à jour et à se tromper.
    #
    # La séparation lecture/écriture se joue ICI. La lecture publique — le seul
    # trafic qui varie d'un facteur cent un soir de gala — part vers « delivery »,
    # qui passe à l'échelle et n'a qu'un rôle PostgreSQL en lecture seule. Tout
    # le reste va vers « core ». nginx choisit le préfixe le plus long, donc cet
    # ordre n'est pas un hasard mais il n'en dépend pas non plus.
    #
    # `set` puis une VARIABLE dans proxy_pass, et non le nom écrit en dur.
    #
    # nginx résout un nom écrit en dur AU DÉMARRAGE. Si le Service n'est pas
    # encore créé, ou si l'image tourne hors du cluster, nginx refuse de
    # démarrer — « host not found in upstream » — et le portail entier tombe,
    # pages statiques comprises, qui n'ont pourtant besoin d'aucune API.
    # Vérifié en faisant tourner nginx sur les deux configurations : avec le
    # nom en dur il refuse de démarrer, avec la variable il démarre, sert les
    # pages en 200 et rend 502 sur l'API. Dégradé plutôt que mort.
    #
    # La variable diffère la résolution à la requête ; le résolveur est écrit
    # au démarrage du conteneur par docker-entrypoint.d/05-resolveur.sh.
    location /api/public/ {
        set $amont_lecture "ensimasso-delivery:8080";
        proxy_pass http://$amont_lecture;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $amont_ecriture "ensimasso-core:8080";
        proxy_pass http://$amont_ecriture;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
