spring:
  application:
    name: ensimasso-core

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:6432/ensimasso}
    username: ${DB_USER:ensimasso}
    password: ${DB_PASSWORD:}
    hikari:
      # Volontairement bas : plusieurs réplicas derrière PgBouncer en mode
      # transaction. C'est l'épuisement de max_connections qui, d'après la
      # revue, constitue la panne la plus probable un soir de gala.
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2

  jpa:
    open-in-view: false          # l'anti-pattern OSIV de la v1
    hibernate:
      ddl-auto: validate         # JAMAIS « update » : le schéma vient de Flyway
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8081/realms/ensimasso}

  threads:
    virtual:
      enabled: true              # Java 21 : utile sur le profil delivery, IO-bound

  # Utilisé uniquement lorsque ensimasso.cache.type vaut « valkey ». Délais
  # courts : le cache est un confort, et attendre un cache en panne coûterait
  # plus cher que de ne pas l'avoir.
  data:
    redis:
      url: ${VALKEY_URL:redis://localhost:6379}
      timeout: 300ms
      connect-timeout: 300ms

# --- stockage objet (MinIO en auto-hébergement) ---
ensimasso:
  # Cache du chemin de lecture public. « memoire » ne demande aucune
  # infrastructure ; « valkey » partage le cache entre répliques du profil
  # delivery. La durée est plafonnée dans le code par la validité des URL de
  # médias : une page mémorisée plus longtemps afficherait des images mortes.
  cache:
    type: ${CACHE_TYPE:memoire}
    duree: ${CACHE_DUREE:PT10M}
    # Borné : un cache sans limite est une fuite de mémoire qu'on ne découvre
    # qu'en production, et le nombre de pages publiques est connu et petit.
    entrees-max: ${CACHE_ENTREES_MAX:500}

  # Limitation de débit sur les seules routes ouvertes sans jeton. Par
  # instance : avec plusieurs répliques, le plafond réel est multiplié d'autant.
  # La limite qui fait autorité est celle de l'Ingress ; celle-ci est une
  # seconde barrière, qui tient même si la première est mal configurée.
  debit:
    actif: ${DEBIT_ACTIF:true}
    par-minute: ${DEBIT_PAR_MINUTE:120}
    clients-max: ${DEBIT_CLIENTS_MAX:10000}

  stockage:
    type: ${STOCKAGE_TYPE:s3}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    acces: ${MINIO_USER:ensimasso}
    secret: ${MINIO_PASSWORD:}
    bucket: ${MINIO_BUCKET_ORIGINAUX:media-originaux}
    region: ${MINIO_REGION:us-east-1}

  paiement:
    type: ${PAIEMENT_TYPE:stripe}
    # Jamais de valeur par défaut pour un secret : une clé absente doit faire
    # échouer bruyamment, pas démarrer avec un placeholder. La v1 avait la
    # clé secrète Stripe en clair dans application.properties, committée.
    cle-secrete: ${STRIPE_CLE_SECRETE:}
    secret-webhook: ${STRIPE_SECRET_WEBHOOK:}

server:
  port: ${PORT:8080}
  error:
    include-message: never       # rien d'interne ne fuit : voir GestionnaireErreurs
    include-stacktrace: never
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true            # /health/liveness et /health/readiness pour k8s
      show-details: when-authorized
  metrics:
    tags:
      application: ensimasso-core

logging:
  # Lisibles à l'œil en développement, structurés en production : « ecs »
  # produit un objet JSON par ligne, que Loki indexe sans expression régulière.
  # C'est ce qui permet de chercher par identifiant de trace plutôt que par
  # sous-chaîne.
  structured:
    format:
      console: ${LOG_FORMAT:}
  level:
    root: INFO
    fr.ensim.asso: ${LOG_LEVEL:INFO}
    # Pas de show-sql : la v1 journalisait toutes ses requêtes en production.
