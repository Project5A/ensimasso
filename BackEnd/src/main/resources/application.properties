# ⚠️  IDENTIFIANTS RETIRÉS DE CE FICHIER — ET TOUJOURS COMPROMIS
#
# Ce fichier contenait, committés en clair depuis février 2025 : le mot de passe
# de la base Azure SQL, la chaîne de connexion complète du compte de stockage
# Azure (clé comprise) et la clé secrète Stripe. C'est le constat SEC-04 de
# l'audit, et le plus grave.
#
# Les valeurs sont remplacées ici par des variables d'environnement. Cela NE
# RÉSOUT PAS l'exposition : elles restent dans l'historique git, accessibles à
# quiconque a cloné le dépôt à n'importe quel moment. La seule correction
# réelle est de RÉVOQUER ces trois identifiants chez Azure et Stripe, que ce
# code tourne encore ou non.
#
# Ce qui est gagné en les retirant d'ici : un clone neuf ne les livre plus, ils
# ne s'affichent plus dans chaque recherche d'éditeur, et l'analyse de secrets
# de l'intégration continue redevient capable de signaler une NOUVELLE fuite.

# Azure SQL Database (SQL Server) Configuration
spring.datasource.url=${AZURE_SQL_URL:}
spring.datasource.username=${AZURE_SQL_USER:}
spring.datasource.password=${AZURE_SQL_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate (JPA) Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServer2012Dialect

# Chaîne de connexion Azure Storage pour le compte "enssimasso"
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}

# Nom du conteneur utilisé pour stocker les photos d'utilisateur
azure.storage.container-name=userphotos
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY:}
